<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jev Rivals</title>
    <link rel="icon" href="favicon.svg" />
    <link rel="stylesheet" href="styles.css" />
    <script type="importmap">
      { "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/" } }
    </script>
  </head>
  <body>
    <div id="stage"></div>
    <div class="hud" id="hud">
      <header class="hud-top">
        <div class="faction-status hud-surface">
          <nav class="faction-switch" id="faction-switch" aria-label="Follow faction"></nav>
          <span class="day">War <strong id="turn">—</strong></span>
          <span class="status" id="connection">Connecting</span>
        </div>
        <div class="stockpile hud-surface" id="stockpile" aria-label="Faction resources"></div>
        <div class="hud-surface speed" id="speed" aria-label="Playback speed">
          <button type="button" data-speed="0" title="Pause">II</button>
          <button type="button" data-speed="1" class="on" title="Normal speed">1×</button>
          <button type="button" data-speed="2" title="Double speed">2×</button>
          <button type="button" data-speed="4" title="Quadruple speed">4×</button>
        </div>
        <button id="toggle-hud" class="hud-button" type="button" aria-pressed="false">Hide HUD <kbd>H</kbd></button>
      </header>

      <section class="spectator-rail" id="rail" aria-label="Stories">
        <button id="toggle-stories" class="hud-surface" type="button" aria-expanded="true"><span data-icon="journal"></span><span class="stories-toggle-label">Stories</span><span class="stories-toggle-chevron" aria-hidden="true">‹</span></button>
        <nav id="intentions" aria-label="What each Jev is doing"></nav>
        <div id="forecast-block" hidden>
          <div class="stories-heading"><span class="detail-label">Next turn</span></div>
          <nav id="forecast" class="event-rail" aria-label="What happens next turn"></nav>
        </div>
        <div class="stories-heading"><span class="detail-label">Stories unfolding</span><span class="live-dot" aria-hidden="true"></span></div>
        <nav id="stories" class="event-rail" aria-label="Developing stories"></nav>
        <p id="stories-quiet" class="quiet-note">A quiet spell. The Jevs are marshalling.</p>
      </section>

      <aside id="event-detail" class="event-detail hud-surface" aria-label="Story details" hidden>
        <div class="panel-heading"><span class="detail-label" id="event-faction"></span><button id="close-event" class="icon-button" type="button" aria-label="Close">×</button></div>
        <h2 id="event-title"></h2>
        <p id="event-message"></p>
        <p id="event-context"></p>
        <div class="story-actions"><button id="event-follow" class="tree-open" type="button">Follow</button><button id="event-locate" class="tree-open" type="button">Go there ↗</button></div>
      </aside>

      <section id="decision" class="objective-popout" aria-live="polite" hidden>
        <div class="popout-heading hud-surface"><span class="popout-crest" id="decision-crest"><span data-icon="target"></span></span><h2 id="decision-title"></h2><span class="jev-tag">Jev</span><span class="popout-sweep"><i id="decision-sweep"></i></span></div>
        <div id="decision-options" class="option-grid"></div>
      </section>

      <section id="faction-panel" class="side-panel hud-surface" aria-label="Faction overview" hidden>
        <div class="panel-heading"><h2 id="faction-title">Faction</h2><button id="close-faction" class="icon-button" type="button" aria-label="Close">×</button></div>
        <div id="faction-body"></div>
      </section>
      <section id="journal" class="side-panel hud-surface" aria-label="War journal" hidden>
        <div class="panel-heading"><h2>War journal</h2><button id="close-journal" class="icon-button" type="button" aria-label="Close">×</button></div>
        <ol id="journal-list"></ol>
      </section>

      <section id="battle-bar" class="hud-surface" hidden>
        <div id="battle-title"></div>
        <div id="battle-bars">
          <div class="force"><span class="swatch" id="battle-attacker-colour"></span><span id="battle-attacker">—</span></div>
          <div id="battle-odds"><div id="battle-odds-fill"></div></div>
          <div class="force"><span id="battle-defender">—</span><span class="swatch" id="battle-defender-colour"></span></div>
        </div>
      </section>

      <section id="aftermath" class="hud-surface" role="status" aria-live="polite" hidden></section>

      <section id="announce" class="hud-surface announce" role="status" aria-live="polite" hidden></section>

      <section id="turn-card" class="hud-surface" aria-live="polite" hidden>
        <span class="turn-art" id="turn-art" aria-hidden="true"></span>
        <span class="turn-crest" id="turn-crest"><span data-icon="flag"></span></span>
        <div class="turn-text"><span class="turn-label" id="turn-label"></span><strong id="turn-faction"></strong><span class="turn-detail" id="turn-detail"></span></div>
      </section>

      <div id="camera-subject" class="hud-surface" role="status" hidden><span data-icon="camera"></span><span id="camera-label"></span><button id="stop-following" type="button" class="icon-button" aria-label="Stop following">×</button></div>


      <footer class="hud-bottom">
        <section class="minimap hud-surface" aria-label="World minimap">
          <div class="minimap-heading"><span>Frontier</span><span title="North">N ↑</span></div>
          <canvas id="minimap" width="300" height="200" tabindex="0" role="button" aria-label="World minimap. Click to move the camera."></canvas>
          <div class="minimap-legend" id="minimap-legend"></div>
        </section>
        <nav class="hud-surface toolbar" aria-label="View controls">
          <button id="toggle-director" type="button" aria-pressed="true" title="Follow the story automatically"><span data-icon="camera"></span><span>Director</span></button>
          <button id="toggle-faction" type="button" aria-expanded="false" title="Faction overview"><span data-icon="faction"></span><span>Faction</span></button>
          <button id="toggle-journal" type="button" aria-expanded="false" title="War journal"><span data-icon="journal"></span><span>Journal</span></button>
          <button id="overview" type="button" title="See the whole map"><span data-icon="map"></span><span>World</span></button>
          <button id="reset-view" type="button" title="Return to the capital · WASD to pan, scroll to zoom"><span data-icon="target"></span><span>Home</span></button>
        </nav>
      </footer>
    </div>
    <div id="banner" hidden></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
