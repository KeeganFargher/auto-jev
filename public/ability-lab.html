<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Jev Ability Lab</title>
<style>
  :root {
    --ink: #eef3f2; --muted: #9fb0b4; --panel: #141a1cf0; --line: #2b3538; --accent: #ffd37c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d1214; color: var(--ink);
    font: 13px/1.45 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  canvas { display: block; width: 100%; height: 100%; }
  .panel { position: fixed; background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    backdrop-filter: blur(8px); padding: 12px; }
  #picker { left: 16px; top: 16px; width: 212px; max-height: calc(100vh - 32px); overflow-y: auto; }
  #tuner  { right: 16px; top: 16px; width: 248px; }
  #hint   { left: 50%; transform: translateX(-50%); bottom: 14px; padding: 6px 12px; color: var(--muted); font-size: 11px; }
  #bar    { left: 50%; transform: translateX(-50%); bottom: 54px; display: flex; gap: 8px; padding: 10px; }
  .slot { position: relative; width: 116px; padding: 9px 10px 10px; background: #1c2427;
    border: 1px solid var(--line); border-radius: 10px; color: currentColor; font: inherit;
    text-align: left; cursor: pointer; overflow: hidden; }
  .slot:hover { background: #232d31; }
  .slot[aria-pressed="true"] { border-color: currentColor; box-shadow: 0 0 0 1px currentColor inset; }
  .slot b { display: block; font-size: 12.5px; font-weight: 700; color: var(--ink); margin-bottom: 3px; }
  .slot .key { position: absolute; top: 7px; right: 8px; font-size: 10px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; }
  .slot .meta { display: flex; gap: 6px; font-size: 10.5px; font-style: normal; }
  .slot .shape { color: currentColor; font-style: normal; }
  .slot .cd { color: var(--muted); font-style: normal; }
  .slot .sweep { position: absolute; inset: 0; pointer-events: none; }
  .slot .count { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
    font-size: 19px; font-weight: 700; color: #fff; text-shadow: 0 1px 4px #000a; font-variant-numeric: tabular-nums; }
  .slot.cooling b, .slot.cooling .meta { opacity: .45; }
  h2 { margin: 0 0 9px; font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
  .jev { display: flex; align-items: center; gap: 9px; width: 100%; margin-bottom: 5px; padding: 7px 9px;
    background: #1c2427; border: 1px solid transparent; border-radius: 9px; color: var(--ink);
    font: inherit; text-align: left; cursor: pointer; }
  .jev:hover { background: #232d31; }
  .jev[aria-pressed="true"] { border-color: currentColor; background: #262f33; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: currentColor; flex: none;
    box-shadow: 0 0 9px currentColor; }
  .jev b { font-weight: 600; color: var(--ink); }
  #jevs.dimmed .jev { opacity: .55; }
  #jevs.dimmed .jev[aria-pressed="true"] { opacity: 1; }
  #library { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  .fx { padding: 6px 7px; background: #1c2427; border: 1px solid transparent; border-radius: 8px;
    color: var(--ink); font: inherit; text-align: left; cursor: pointer; }
  .fx:hover { background: #232d31; }
  .fx[aria-pressed="true"] { border-color: var(--accent); background: #2b2a20; }
  .fx b { display: block; font-size: 11.5px; font-weight: 600; }
  .fx span { display: block; font-size: 10px; color: var(--muted); }
  .jev span { display: block; font-size: 11px; color: var(--muted); }
  .row { display: flex; justify-content: space-between; align-items: baseline; margin: 10px 0 3px; }
  .row label { font-size: 11px; color: var(--muted); }
  .row output { font-variant-numeric: tabular-nums; font-size: 11px; color: var(--accent); }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  .toggles { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
  .toggles button { flex: 1 1 auto; padding: 6px 8px; background: #1c2427; border: 1px solid var(--line);
    border-radius: 7px; color: var(--muted); font: inherit; font-size: 11px; cursor: pointer; }
  .toggles button[aria-pressed="true"] { color: #0d1214; background: var(--accent); border-color: var(--accent); }
  #cast { width: 100%; margin-top: 12px; padding: 9px; border: 0; border-radius: 9px; background: var(--accent);
    color: #0d1214; font: inherit; font-weight: 700; letter-spacing: .04em; cursor: pointer; }
  #spec { margin-top: 12px; padding-top: 10px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted); }
  #spec code { color: var(--accent); font-size: 11px; }
  kbd { padding: 1px 5px; border: 1px solid var(--line); border-radius: 4px; background: #1c2427; font-size: 11px; }
</style>
</head>
<body>
<div id="stage"></div>

<div class="panel" id="picker">
  <h2>Jev</h2>
  <div id="jevs"></div>

</div>

<div class="panel" id="tuner">
  <h2>Tuning</h2>
  <div class="row"><label for="radius">AoE radius</label><output id="radiusOut"></output></div>
  <input type="range" id="radius" min="2" max="14" step="0.5" />
  <div class="row"><label for="telegraph">Telegraph</label><output id="telegraphOut"></output></div>
  <input type="range" id="telegraph" min="0" max="2000" step="50" />
  <div class="row"><label for="impact">Impact + decay</label><output id="impactOut"></output></div>
  <input type="range" id="impact" min="200" max="3000" step="50" />
  <div class="toggles">
    <button id="loop" aria-pressed="true">Loop</button>
    <button id="slow" aria-pressed="false">0.25×</button>
    <button id="spin" aria-pressed="false">Orbit</button>
  </div>
  <button id="cast">Cast</button>
  <div id="spec"></div>
</div>

<div class="panel" id="bar"></div>
<div class="panel" id="hint"><kbd>1</kbd>–<kbd>6</kbd> Jev · <kbd>Q</kbd><kbd>W</kbd><kbd>E</kbd> abilities · <kbd>space</kbd> recast · drag to orbit</div>

<script type="importmap">
  { "imports": { "three": "/vendor/three/three.module.js", "three/addons/": "/vendor/three/addons/" } }
</script>
<script type="module" src="./ability-lab.js"></script>
</body>
</html>
