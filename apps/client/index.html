<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jev-game battle lab</title>
  </head>
  <body>
    <div id="lab-canvas-root"></div>
    <div id="lab-hud">
      <div id="lab-status" class="hud-status"></div>
      <div id="lab-feed" class="hud-feed"></div>
      <div id="lab-unit" class="hud-unit" hidden></div>
      <div id="lab-bar" class="hud-bar"></div>
      <details id="lab-tuning" class="hud-tuning">
        <summary>tuning</summary>
        <div class="hud-tuning-body">
          <div id="lab-tuning-fields"></div>
          <div id="lab-upgrades" class="hud-upgrades"></div>
          <textarea id="lab-scenario-text" rows="4" spellcheck="false"></textarea>
          <div class="hud-row">
            <button id="lab-scenario-export">export</button>
            <button id="lab-scenario-import">import</button>
          </div>
          <p id="lab-scenario-error" class="hud-error"></p>
        </div>
      </details>
      <a id="mode-switch-link" class="mode-switch pill-button" href="#match">match</a>
    </div>
    <div id="match-root" class="match-root" hidden></div>
    <div id="env-root" class="env-root" hidden></div>
    <div id="models-root" class="env-root" hidden></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
