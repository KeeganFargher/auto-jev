<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>jev-game battle lab</title>
  </head>
  <body>
    <div id="lab">
      <h1>Battle laboratory</h1>
      <div id="lab-scene"></div>
      <details id="lab-scenario">
        <summary>Scenario export / import</summary>
        <textarea id="lab-scenario-text" rows="10"></textarea>
        <div class="lab-button-row">
          <button id="lab-scenario-export">Export current</button>
          <button id="lab-scenario-import">Import</button>
        </div>
        <p id="lab-scenario-error" class="lab-error"></p>
      </details>
    </div>
    <script type="module" src="/src/lab.ts"></script>
  </body>
</html>
